<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }
        h2 {
            text-align: center;
        }
        form {
            background-color: #fff;
            padding: 20px;
            width: 400px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        .gender, .languages {
            margin-top: 5px;
        }
        .gender input, .languages input {
            margin-right: 5px;
        }
        .dob-select {
            display: flex;
            gap: 10px;
        }
        .dob-select select {
            flex: 1;
        }
        .submit-btn {
            margin-top: 15px;
            text-align: center;
        }
        .submit-btn input {
            width: auto;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <h2>Registration Form</h2>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <label for="email">Email ID:</label>
        <input type="email" id="email" name="email">

        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" name="phone">

        <label>Sex:</label>
        <div class="gender">
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
        </div>

        <label>Date of Birth:</label>
        <div class="dob-select">
            <select name="day">
                <option>Day</option>
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
                <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
                <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
                <option>21</option><option>22</option><option>23</option><option>24</option><option>25</option>
                <option>26</option><option>27</option><option>28</option><option>29</option><option>30</option>
                <option>31</option>
            </select>
            <select name="month">
                <option>Month</option>
                <option>January</option><option>February</option><option>March</option><option>April</option>
                <option>May</option><option>June</option><option>July</option><option>August</option>
                <option>September</option><option>October</option><option>November</option><option>December</option>
            </select>
            <select name="year">
                <option>Year</option>
                <option>1980</option><option>1981</option><option>1982</option><option>1983</option>
                <option>1984</option><option>1985</option><option>1986</option><option>1987</option>
                <option>1988</option><option>1989</option><option>1990</option><option>1991</option>
                <option>1992</option><option>1993</option><option>1994</option><option>1995</option>
                <option>1996</option><option>1997</option><option>1998</option><option>1999</option>
                <option>2000</option><option>2001</option><option>2002</option><option>2003</option>
                <option>2004</option><option>2005</option><option>2006</option><option>2007</option>
                <option>2008</option><option>2009</option><option>2010</option><option>2011</option>
                <option>2012</option><option>2013</option><option>2014</option><option>2015</option>
                <option>2016</option><option>2017</option><option>2018</option><option>2019</option>
                <option>2020</option><option>2021</option><option>2022</option><option>2023</option>
                <option>2024</option><option>2025</option>
            </select>
        </div>

        <label>Languages Known:</label>
        <div class="languages">
            <input type="checkbox" id="english" name="language" value="English">
            <label for="english">English</label>
            <input type="checkbox" id="telugu" name="language" value="Telugu">
            <label for="telugu">Telugu</label>
            <input type="checkbox" id="hindi" name="language" value="Hindi">
            <label for="hindi">Hindi</label>
            <input type="checkbox" id="tamil" name="language" value="Tamil">
            <label for="tamil">Tamil</label>
        </div>

        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4"></textarea>

        <div class="submit-btn">
            <input type="submit" value="Register">
        </div>
    </form>
</body>
</html>
